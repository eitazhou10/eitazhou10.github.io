<!-- ─── Giscus 评论 (GitHub Discussions) ──────────────────
  首次部署前需完成:
  1. 在你的 GitHub 仓库 Settings → General → 勾选 Discussions
  2. 访问 https://giscus.app 生成 repo-id / category-id
  3. 替换下面的 data-repo-id 和 data-category-id
  ─────────────────────────────────────────────────────── -->
<div class="giscus" style="margin-top: 3rem;">
<script src="https://giscus.app/client.js"
        data-repo="eitazhou/eitazhou.github.io"
        data-repo-id="REPLACE_WITH_REPO_ID"
        data-category="Announcements"
        data-category-id="REPLACE_WITH_CATEGORY_ID"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
</script>
<noscript>请启用 JavaScript 以查看 <a href="https://giscus.app">Giscus</a> 评论。</noscript>
</div>
